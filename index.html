    <!-- Main Content: Split View -->
    <main class="converter-stage">
      <!-- LEFT PANEL: MsgPack -->
      <section class="panel col-msgpack">
        <div class="panel-header">
          <label class="panel-label">MsgPack (Binary)</label>
          <div class="format-selector" id="msgpack-format-selector">
            <button class="format-btn active" data-format="base64">Base64</button>
            <button class="format-btn" data-format="hex">Hex</button>
            <button class="format-btn" data-format="gobyte">[]byte</button>
          </div>
        </div>
        <textarea id="msgpack-text" class="code-textarea" placeholder="Paste MsgPack / Output appears here..." spellcheck="false"></textarea>
        <div class="panel-footer">
          <button class="small-btn" id="copy-msgpack" title="Copy to clipboard">Copy</button>
          <div class="error-message" id="msgpack-error"></div>
        </div>
      </section>

      <!-- CENTER ACTIONS -->
      <section class="col-actions">
        <button class="action-btn decode-btn" id="decode-btn" title="Decode: MsgPack → JSON">
          <span class="btn-text">Decode</span>
          <span class="btn-arrow">→</span>
        </button>

        <button class="action-btn encode-btn" id="encode-btn" title="Encode: JSON → MsgPack">
          <span class="btn-arrow">←</span>
          <span class="btn-text">Encode</span>
        </button>
      </section>

      <!-- RIGHT PANEL: JSON -->
      <section class="panel col-json">
        <div class="panel-header">
          <label class="panel-label">JSON (Structure)</label>
        </div>
        <textarea id="json-text" class="code-textarea" placeholder="Paste JSON / Output appears here..." spellcheck="false"></textarea>
        <div class="panel-footer">
          <button class="small-btn" id="copy-json" title="Copy to clipboard">Copy</button>
          <div class="error-message" id="json-error"></div>
        </div>
      </section>
